<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="icon" href="data:,">
  <title>纸盒展开实验室 V2.8 单文件版</title>
  <style>
    :root{
      --ink:#213244;--muted:#67798a;--line:#d6e0e8;--paper:#f1f4f7;--white:#fff;
      --blue:#4c73dc;--blue-soft:#edf1ff;--teal:#16847d;--teal-soft:#e6f4f1;
      --red:#d14f56;--red-soft:#fff0f1;--amber:#d59b19;--amber-soft:#fff7dc;
      --shadow:0 10px 26px rgba(41,58,76,.13);--shadow-soft:0 5px 14px rgba(41,58,76,.10)
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--paper);letter-spacing:0;user-select:none;-webkit-user-select:none}
    button,input{font:inherit;letter-spacing:0}
    button{cursor:pointer;transition:background-color .16s ease,border-color .16s ease,color .16s ease,transform .16s ease,box-shadow .16s ease}
    button:not(:disabled):active{transform:scale(.96)}
    button:focus-visible,input:focus-visible{outline:3px solid rgba(76,115,220,.28);outline-offset:2px}
    button:disabled{opacity:.42;cursor:not-allowed}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

    #app{position:relative;width:100%;height:100dvh;overflow:hidden;background:#eef2f6}
    #stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
    #stage canvas{display:block;width:100%;height:100%}
    .ground-shadow{position:absolute;left:50%;top:62%;width:32%;height:12%;border-radius:50%;background:rgba(67,83,100,.08);filter:blur(22px);transform:translate(-50%,-50%);pointer-events:none}

    .status-pill{position:absolute;left:50%;top:22px;z-index:30;display:flex;align-items:center;gap:11px;min-height:58px;padding:7px 15px 7px 8px;border:1px solid rgba(203,214,223,.95);border-radius:10px;background:rgba(255,255,255,.96);box-shadow:var(--shadow);transform:translateX(-50%);backdrop-filter:blur(12px)}
    .tool-state{height:42px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:7px;background:var(--blue);color:#fff;font-size:17px;font-weight:900;white-space:nowrap}
    .tool-state svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
    .status-copy{min-width:210px;color:#455a6d;font-size:17px;font-weight:900;white-space:nowrap}
    .status-copy strong{color:var(--red);font-size:25px}.status-copy.done strong{color:var(--teal)}

    .dimension-panel{position:absolute;left:20px;bottom:91px;z-index:34;width:306px;display:grid;gap:7px;padding:10px;border:1px solid rgba(205,216,225,.95);border-radius:10px;background:rgba(255,255,255,.98);box-shadow:var(--shadow);backdrop-filter:blur(10px);transition:opacity .18s ease}
    .dimension-panel[hidden]{display:none}.dimension-panel.locked{opacity:.48;pointer-events:none}
    .dimension-row{height:43px;display:grid;grid-template-columns:34px 38px minmax(0,1fr) 28px;align-items:center;gap:7px;padding:0 8px;border-radius:7px;background:#f6f8fa}
    .dimension-row label{font-size:16px;font-weight:900}.dimension-row output{color:var(--blue);font-size:19px;font-weight:900;text-align:center}
    .dimension-row input{width:100%;height:28px;margin:0;accent-color:var(--blue);cursor:pointer}
    .dimension-row span{color:#788897;font-size:13px;font-weight:800;text-align:right}

    .dock{position:absolute;left:50%;bottom:22px;z-index:32;display:flex;align-items:center;gap:4px;padding:6px;border:1px solid rgba(203,214,223,.96);border-radius:11px;background:rgba(255,255,255,.97);box-shadow:var(--shadow);transform:translateX(-50%);backdrop-filter:blur(12px)}
    .dock-button{height:52px;min-width:118px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 15px;border:1px solid transparent;border-radius:8px;background:transparent;color:#51677a;font-size:16px;font-weight:900;white-space:nowrap}
    .dock-button svg,.utility-button svg,.annotation-button svg,.modal-close svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
    .dock-button:not(:disabled):hover{background:#f2f5f8;color:var(--blue)}
    .dock-button.active{border-color:#c4d0f7;background:var(--blue-soft);color:#3f64cd;box-shadow:inset 0 0 0 1px #dce3fb}
    .dock-button.cut.active{border-color:#f0bec2;background:var(--red-soft);color:#b94048}
    .dock-button.count.active{border-color:#b9ddd6;background:var(--teal-soft);color:#116d68}
    .dock-button.restore{color:#a56b00}.dock-button.restore:not(:disabled):hover{background:var(--amber-soft);color:#8b5900}.dock-button.restore.active{border-color:#e7c56c;background:var(--amber-soft);color:#8b5900;box-shadow:inset 0 0 0 1px #f4df9d}
    .dock-button.verify.active{border-color:#d7c8f4;background:#f3effc;color:#6c4ab6;box-shadow:inset 0 0 0 1px #e8dff8}
    .dock-divider{width:1px;height:34px;background:#dce4ea;margin:0 2px}

    .right-console{position:absolute;right:20px;bottom:22px;z-index:38;width:339px;max-height:calc(100dvh - 44px);display:flex;flex-direction:column;gap:10px}
    .mode-switch{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;padding:5px;border:1px solid rgba(203,214,223,.96);border-radius:10px;background:rgba(255,255,255,.98);box-shadow:var(--shadow)}
    .mode-tab{height:50px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;border:1px solid transparent;border-radius:7px;background:transparent;color:#5d7183;font-size:17px;font-weight:900}.mode-tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.mode-tab.active{border-color:#c6d2f6;background:#edf1ff;color:#3f64cd}.mode-tab.verify.active{border-color:#d7c8f4;background:#6c4ab6;color:#fff}

    .verify-panel{position:relative;width:100%;min-height:66px;display:grid;grid-template-columns:86px minmax(0,1fr) 54px;align-items:center;gap:8px;padding:9px 10px;border:1px solid #d6ccec;border-radius:10px;background:rgba(255,255,255,.98);box-shadow:var(--shadow)}
    .verify-panel[hidden]{display:none}.verify-panel strong{color:#573b92;font-size:17px;white-space:nowrap}
    .verify-range{min-width:0;width:100%;height:34px;margin:0;accent-color:#6c4ab6;cursor:ew-resize}
    .verify-percent{min-width:0;color:#6c4ab6;font-size:20px;font-weight:900;text-align:right}
    .verify-auto{grid-column:1/-1;height:44px;width:100%;padding:0 14px;border:1px solid #6c4ab6;border-radius:8px;background:#6c4ab6;color:#fff;font-size:16px;font-weight:900}
    .verify-auto:not(:disabled):hover{background:#573b92}

    .fold-lab{position:relative;width:100%;display:flex;flex-direction:column;padding:14px;border:1px solid #cbd8e1;border-radius:10px;background:rgba(255,255,255,.98);box-shadow:var(--shadow)}
    .fold-lab[hidden]{display:none}.fold-lab-head{height:40px;display:flex;align-items:center;margin-bottom:8px;padding:0 2px}.fold-lab-head strong{font-size:23px}
    .net-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.net-card{position:relative;height:116px;padding:8px;border:2px solid #d5e0e7;border-radius:8px;background:#f7f9fb;color:var(--ink)}
    .net-card:not(:disabled):hover{border-color:#76a5bf;background:#f0f7fa}.net-card.active{border-color:#16847d;background:#eaf6f3;box-shadow:inset 0 0 0 2px rgba(22,132,125,.12)}
    .net-num{position:absolute;left:12px;top:8px;font-size:24px;font-weight:900}.net-verdict{position:absolute;right:9px;top:8px;min-width:48px;padding:4px 7px;border-radius:6px;color:#fff;background:#16847d;font-size:15px;font-weight:900;opacity:0}.net-card.revealed .net-verdict{opacity:1}.net-card.invalid .net-verdict{background:#c5434b}
    .mini-net{position:absolute;left:50%;top:57%;width:0;height:0}.mini-cell{position:absolute;width:26px;height:26px;border:2px solid #28485d;background:#dceaf4;transform:translate(-50%,-50%)}
    .custom-net-button{height:52px;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:8px;border:2px solid #a7c9d9;border-radius:8px;background:#edf7fa;color:#17628d;font-size:18px;font-weight:900}.custom-net-button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

    .snapshot-rail{position:absolute;left:20px;top:22px;z-index:37;width:168px;max-height:calc(100dvh - 222px);padding:10px;border:1px solid #cbd8e1;border-radius:10px;background:rgba(255,255,255,.97);box-shadow:var(--shadow);overflow:hidden}.snapshot-rail[hidden]{display:none}.snapshot-head{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 3px 8px}.snapshot-head strong{font-size:19px}.snapshot-clear{width:36px;height:36px;display:grid;place-items:center;padding:0;border:1px solid #d7e1e8;border-radius:7px;background:#fff;color:#687c8d}.snapshot-clear svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .snapshot-list{display:grid;gap:8px;max-height:calc(100dvh - 282px);overflow-y:auto;overscroll-behavior:contain}.snapshot-item{position:relative;width:100%;height:91px;padding:0;overflow:hidden;border:2px solid #d6e0e7;border-radius:7px;background:#e9eef2}.snapshot-item:hover{border-color:#6f9cb6}.snapshot-item img{width:100%;height:100%;display:block;object-fit:cover}.snapshot-item span{position:absolute;left:6px;bottom:6px;padding:3px 7px;border-radius:5px;background:rgba(31,49,65,.86);color:#fff;font-size:13px;font-weight:900}.snapshot-item b{position:absolute;right:6px;top:6px;width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:#17628d;color:#fff;font-size:14px}
    .has-snapshots .dimension-panel,.has-snapshots .annotation-tools{left:198px}

    .draw-dialog{width:min(560px,calc(100vw - 40px));overflow:hidden;border:1px solid #cbd8e1;border-radius:10px;background:#fff;box-shadow:0 24px 62px rgba(25,39,54,.28)}
    .draw-head{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e1e8ed}.draw-head strong{font-size:23px}.draw-body{padding:16px 20px}.draw-count{margin-bottom:12px;color:#65798a;font-size:17px;font-weight:900;text-align:center}.draw-count b{color:#17628d;font-size:25px}
    .custom-grid{width:max-content;display:grid;grid-template-columns:repeat(7,46px);grid-template-rows:repeat(7,46px);gap:3px;margin:auto;padding:10px;border:1px solid #cbd9e2;border-radius:8px;background:#eef3f6;touch-action:none}.custom-cell{width:46px;height:46px;padding:0;border:1px solid #cbd8e1;border-radius:4px;background:#fff}.custom-cell.active{border-color:#116d68;background:#78c6bb;box-shadow:inset 0 0 0 3px #fff}
    .draw-actions{height:70px;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 18px;border-top:1px solid #e1e8ed;background:#f7f9fb}.draw-action{height:48px;min-width:118px;padding:0 18px;border:1px solid #cbd8e1;border-radius:8px;background:#fff;color:#536a7c;font-size:17px;font-weight:900}.draw-action.primary{min-width:150px;border-color:#17628d;background:#17628d;color:#fff}

    .utility{position:absolute;left:20px;bottom:22px;z-index:33;display:flex;gap:5px;padding:6px;border:1px solid rgba(203,214,223,.96);border-radius:10px;background:rgba(255,255,255,.97);box-shadow:var(--shadow-soft)}
    .utility-button{width:50px;height:50px;display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:8px;background:transparent;color:#536a7d}
    .utility-button:not(:disabled):hover{background:#f1f5f8;color:var(--blue)}
    .utility-button.active{background:var(--blue);color:#fff}

    .annotation-layer{position:absolute;inset:0;z-index:50;width:100%;height:100%;pointer-events:none;touch-action:none}
    .annotation-layer.active{pointer-events:auto;cursor:crosshair}
    .annotation-tools{position:absolute;left:20px;bottom:91px;z-index:55;display:none;align-items:center;gap:6px;padding:7px;border:1px solid #d1dde5;border-radius:9px;background:rgba(255,255,255,.98);box-shadow:var(--shadow)}
    .annotation-tools.active{display:flex}
    .annotation-button{width:42px;height:42px;display:grid;place-items:center;padding:0;border:1px solid #d8e2e8;border-radius:7px;background:#fff;color:#4e6578}
    .annotation-button.active{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
    .swatch{width:31px;height:31px;padding:0;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #bfcdd7}
    .swatch.active{box-shadow:0 0 0 3px var(--blue)}

    .toast{position:absolute;left:50%;top:94px;z-index:70;max-width:min(640px,78vw);padding:12px 20px;border-radius:8px;background:#26384a;color:#fff;box-shadow:var(--shadow);font-size:17px;font-weight:900;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,-10px);transition:.18s}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .toast.error{background:#b93f47}.toast.success{background:#14746d}
    .scissor-fly{position:absolute;left:0;top:0;z-index:45;width:48px;height:48px;display:grid;place-items:center;border:2px solid #fff;border-radius:50%;background:var(--red);color:#fff;box-shadow:0 8px 18px rgba(151,43,51,.28);opacity:0;pointer-events:none;transform:translate(-50%,-50%) rotate(-12deg) scale(.8)}
    .scissor-fly svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .scissor-fly.run{opacity:1;transform:translate(-50%,-50%) rotate(9deg) scale(1)}

    .modal-backdrop{position:absolute;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(30,42,56,.38);backdrop-filter:blur(4px)}
    .modal-backdrop[hidden]{display:none}
    .help-dialog{width:min(620px,calc(100vw - 40px));overflow:hidden;border:1px solid #d3dee6;border-radius:10px;background:#fff;box-shadow:0 24px 62px rgba(25,39,54,.28)}
    .help-head{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e1e8ed}
    .help-head strong{font-size:21px}.modal-close{width:40px;height:40px;display:grid;place-items:center;padding:0;border:1px solid #d8e2e8;border-radius:7px;background:#fff;color:#536a7c}
    .help-steps{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px}
    .help-step{min-height:112px;padding:16px;border:1px solid #dce5eb;border-radius:8px;background:#f8fafb}
    .help-step b{display:block;margin-bottom:7px;color:var(--blue);font-size:18px}.help-step span{color:#5f7385;font-size:15px;font-weight:700;line-height:1.55}

    @media(max-width:1180px){
      .dimension-panel{left:10px;width:286px}.utility{left:10px}.dock-button{min-width:92px;padding:0 9px}.status-copy{min-width:180px}.right-console{right:10px;width:339px}.snapshot-rail{left:10px;width:148px}.has-snapshots .dimension-panel,.has-snapshots .annotation-tools{left:168px}.net-card{height:110px}
    }
    @media(max-width:1100px){.utility,.right-console{bottom:82px}.dimension-panel,.annotation-tools{bottom:152px}}
    @media(max-width:900px){
      .status-pill{top:12px}.dimension-panel{left:10px;bottom:218px;width:286px}.dock{left:10px;right:10px;bottom:10px;width:auto;max-width:none;overflow-x:auto;transform:none}.dock-button{flex:0 0 104px}.utility{left:10px;bottom:148px}.annotation-tools{left:10px;bottom:218px}.help-steps{grid-template-columns:1fr}.right-console{right:10px;bottom:148px;width:min(339px,calc(100vw - 20px));max-height:calc(100dvh - 170px)}.snapshot-rail{left:10px;top:146px;width:142px}.net-card{height:108px}.custom-grid{grid-template-columns:repeat(7,38px);grid-template-rows:repeat(7,38px)}.custom-cell{width:38px;height:38px}
    }
    @media(max-width:700px){.dimension-panel,.annotation-tools{bottom:294px}.right-console{bottom:222px;max-height:calc(100dvh - 244px)}}
    @media(max-height:720px){.status-pill{top:10px}.dock,.utility{bottom:10px}.dimension-panel{left:10px;bottom:80px;gap:5px;padding:7px}.right-console{bottom:10px;max-height:calc(100dvh - 20px)}.annotation-tools{left:10px;bottom:80px}.mode-tab{height:46px}.fold-lab{padding:10px}.fold-lab-head{height:34px;margin-bottom:6px}.net-card{height:96px}.custom-net-button{height:46px}.verify-auto{height:40px}.utility{left:10px}.dock-button{height:48px}.dimension-row{height:38px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main id="app">
    <div class="ground-shadow" aria-hidden="true"></div>
    <div id="stage" aria-label="可旋转的三维纸盒"></div>

    <div class="status-pill" role="status" aria-live="polite">
      <span class="tool-state" id="tool-state">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="m8.7 8.4 11.3 6.1M8.7 15.6 20 9.5"/></svg>
        <span id="tool-state-text">剪刀</span>
      </span>
      <span class="status-copy" id="status-copy">已剪 <strong id="cut-count">0</strong> / 7 条棱</span>
    </div>

    <section class="dimension-panel" id="dimension-panel" aria-label="纸盒尺寸" hidden>
      <div class="dimension-row"><label for="size-w">长</label><output id="size-w-value">5</output><input id="size-w" type="range" min="3" max="7" value="5" step="1"><span>单位</span></div>
      <div class="dimension-row"><label for="size-d">宽</label><output id="size-d-value">4</output><input id="size-d" type="range" min="3" max="7" value="4" step="1"><span>单位</span></div>
      <div class="dimension-row"><label for="size-h">高</label><output id="size-h-value">8</output><input id="size-h" type="range" min="5" max="10" value="8" step="1"><span>单位</span></div>
    </section>

    <aside class="snapshot-rail" id="snapshot-rail" aria-label="快照" hidden>
      <header class="snapshot-head"><strong>快照</strong><button class="snapshot-clear" id="snapshot-clear" type="button" title="清空快照" aria-label="清空快照"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6"/></svg></button></header>
      <div class="snapshot-list" id="snapshot-list"></div>
    </aside>

    <nav class="dock" aria-label="纸盒操作工具">
      <button class="dock-button cut active" id="cut-tool" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="m8.7 8.4 11.3 6.1M8.7 15.6 20 9.5"/></svg><span>剪刀</span>
      </button>
      <button class="dock-button" id="mark-tool" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>标记面</span>
      </button>
      <button class="dock-button count" id="count-tool" type="button" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 3v6M14 9v6M19 15v6"/></svg><span>数棱</span>
      </button>
      <button class="dock-button restore" id="restore-tool" type="button" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8 12 4l8 4-8 4-8-4Z"/><path d="M4 8v8l8 4 8-4V8M12 12v8"/><path d="m7 3-3 3 3 3"/></svg><span id="restore-tool-text">恢复</span>
      </button>
      <span class="dock-divider" aria-hidden="true"></span>
      <button class="dock-button" id="demo-button" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><span>演示剪法</span>
      </button>
    </nav>

    <aside class="right-console" aria-label="实验模式与验证工具">
      <section class="fold-lab" id="fold-lab" aria-label="折一折" hidden>
        <header class="fold-lab-head"><strong>折一折</strong></header>
        <div class="net-grid" id="net-grid"></div>
        <button class="custom-net-button" id="custom-net-button" type="button"><svg viewBox="0 0 24 24"><path d="M4 20h16M5 16 16 5l3 3L8 19l-4 1Z"/><path d="m14 7 3 3"/></svg><span>自由绘制展开图</span></button>
      </section>
      <section class="verify-panel" id="verify-panel" aria-label="折叠验证" hidden>
        <strong id="verify-panel-title">折叠验证</strong>
        <input class="verify-range" id="verify-range" type="range" min="0" max="100" step="1" value="0" aria-label="验证折叠进度">
        <output class="verify-percent" id="verify-percent">0%</output>
        <button class="verify-auto" id="verify-auto" type="button">自动折叠</button>
      </section>
      <div class="mode-switch" role="tablist" aria-label="实验模式">
